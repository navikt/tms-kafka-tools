[metadata]
format.version = "1.1"

[versions]
awaitility = "4.3.0"
coroutines = "1.11.0"
kotlinxIo = "0.9.1"
jacksonDatatype = "2.23.0"
junitJupiter = "6.1.3"
junitPlatform = "6.1.3"
kafka = "4.3.1"
kotest = "6.2.7"
kotlin = "2.4.21"
kotlinLogging = "8.0.7"
ktor = "3.6.1"
logback = "1.6.8"
micrometer = "1.18.0"
prometheus = "1.10.0"
slf4j = "2.0.19"
testcontainers = "2.0.5"
tmsCommonLib = "5.3.7"
tmsKtorTokenSupport = "6.0.4"

[libraries]
awaitility = { group = "org.awaitility", name = "awaitility", version.ref = "awaitility" }

jackson-datatypeJsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310", version.ref = "jacksonDatatype" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jacksonDatatype" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jacksonDatatype" }
jackson-moduleKotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jacksonDatatype" }

junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }

kafka-clients = { group = "org.apache.kafka", name = "kafka-clients", version.ref = "kafka" }

kotest-assertionsCore = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-assertionsShared = { group = "io.kotest", name = "kotest-assertions-shared", version.ref = "kotest" }

kotlinLogging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlinLogging" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-ioCore = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinxIo" }

ktor-client-apache5 = { group = "io.ktor", name = "ktor-client-apache5", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-events = { group = "io.ktor", name = "ktor-events", version.ref = "ktor" }
ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }
ktor-io = { group = "io.ktor", name = "ktor-io", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-metricsMicrometer = { group = "io.ktor", name = "ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-utils = { group = "io.ktor", name = "ktor-utils", version.ref = "ktor" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
micrometer-registryPrometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }
prometheus-metricsExpositionTextformats = { group = "io.prometheus", name = "prometheus-metrics-exposition-textformats", version.ref = "prometheus" }
prometheus-metricsCore = { group = "io.prometheus", name = "prometheus-metrics-core", version.ref = "prometheus" }
prometheus-metricsModel = { group = "io.prometheus", name = "prometheus-metrics-model", version.ref = "prometheus" }

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

testcontainers-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-kafka = { group = "org.testcontainers", name = "testcontainers-kafka", version.ref = "testcontainers" }

tms-commonLib-teamLogger = { group = "no.nav.tms.common", name = "team-logger", version.ref = "tmsCommonLib" }
tms-ktorTokenSupport-entraId-verificationMock = { group = "no.nav.tms.token.support", name = "entra-id-token-verification-mock", version.ref = "tmsKtorTokenSupport" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
